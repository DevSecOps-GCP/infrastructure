global:
  domain: argocd.internal.devsecopsglobal.tech

crds:
  keep: true

configs:
  params:
    server.insecure: false
  cm:
    admin.enabled: true
    exec.enabled: false
    timeout.reconciliation: 180s

dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

server:
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

applicationSet:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

redis:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
