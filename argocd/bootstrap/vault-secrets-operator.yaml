# Syncs Vault secrets into Kubernetes Secrets on the prod cluster. Apps declare what they
# need with VaultAuth and VaultStaticSecret resources in their own namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
spec:
  project: system
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault-secrets-operator
      targetRevision: 1.6.0
      helm:
        releaseName: vault-secrets-operator
        valueFiles:
          - $values/kubernetes/helm/system/vault-secrets-operator/values-prod.yaml
    - repoURL: https://github.com/DevSecOps-GCP/infrastructure
      targetRevision: main
      ref: values
  destination:
    name: prod
    namespace: vault-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
