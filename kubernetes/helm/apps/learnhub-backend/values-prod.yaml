# Production values for deploy/backend in DevSecOps-GCP/devsecopsglobal.
image:
  # Release commit; promotion PRs from the app repository update it.
  tag: 71bc7883c18f4d8abd067dd14c9b26a7ac932422

serviceAccount:
  # terraform/540-gcs/apps/prod: backend_service_account
  gcpServiceAccount: learnhub-backend@devsecopsglobal-prod.iam.gserviceaccount.com

config:
  TRUSTED_XFF_HOPS: "2"
  GCS_BUCKET: devsecopsglobal-prod-videos
  DB_HOST: postgres.internal.devsecopsglobal.tech
  DB_PORT: "5432"
  DB_NAME: learnhub
  DB_USER: learnhub
  DB_SSL: verify-ca
  DB_CA_CERT: /etc/learnhub/ca/postgres.pem
  # The Memorystore server certificate names the instance IP, so clients verify against it.
  REDIS_HOST: 10.50.5.75
  REDIS_PORT: "6378"
  REDIS_TLS: "true"
  REDIS_CA_CERT: /etc/learnhub/ca/redis.pem

