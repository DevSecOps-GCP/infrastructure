# Service for the Gateway: HTTPS to argocd-server, which serves TLS on 8080.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-gateway
  namespace: argocd
spec:
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
      appProtocol: HTTPS
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: argocd-server
  namespace: argocd
spec:
  default:
    config:
      type: HTTPS
      httpsHealthCheck:
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: argocd-server-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: ops
      namespace: internal-ingress
      sectionName: https
  hostnames:
    - argocd.internal.devsecopsglobal.tech
  rules:
    - backendRefs:
        - name: argocd-server-gateway
          port: 443
