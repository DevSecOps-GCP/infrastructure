# The Terraform pipeline reaches Vault through a port-forward; it may do nothing else here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-port-forward
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraform-pipeline
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-port-forward
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: tf-plan@project-bb8996af-ebec-47fd-869.iam.gserviceaccount.com
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: tf-apply@project-bb8996af-ebec-47fd-869.iam.gserviceaccount.com
