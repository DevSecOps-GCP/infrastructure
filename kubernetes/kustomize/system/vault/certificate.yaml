apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - vault.internal.devsecopsglobal.tech
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
