apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheus-frontend.yaml
# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard in this namespace.
configMapGenerator:
  - name: dashboard-learnhub
    files:
      - dashboards/learnhub.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
